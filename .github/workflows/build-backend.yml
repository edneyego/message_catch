name: Build and Push Backend Image

on:
  push:
    branches:
      - main
      - PROD
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  notify-infra:
    if: github.ref == 'refs/heads/PROD'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Message Catch deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SGB_INFRA_DISPATCH_TOKEN }}
          repository: edneyego/sgb_infra
          event-type: deploy-message-catch
          client-payload: '{"project":"message_catch","ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}'
